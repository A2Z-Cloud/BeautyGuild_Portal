name: Portal V2 frontend checks
on:
  pull_request:
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal-v2-frontend.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run schema tests and production build
        run: npm run check
