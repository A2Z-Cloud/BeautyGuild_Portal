name: Portal V2 checks
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal-v2-checks.yml"
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate unit tests and static build
        run: npm run check
      - name: Install API dependencies
        working-directory: apps/portal/functions/beauty_guild_api
        run: npm ci --no-audit --no-fund
      - name: Validate API tests
        working-directory: apps/portal/functions/beauty_guild_api
        run: npm test
