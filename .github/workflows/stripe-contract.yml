name: Stripe contract test
# Runs the portal against the real Stripe API in test mode (apps/portal/functions/beauty_guild_api/test/stripe-contract.test.js).
# Nightly, and on demand from the Actions tab. Not on pull requests, so the key is never exposed to a branch.
# Needs the repository secret STRIPE_TEST_KEY (an sk_test_ key). Without it the job passes with a notice and tests nothing.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
jobs:
  stripe-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal/functions/beauty_guild_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the secret is set
        id: key
        env:
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
        run: |
          if [ -z "$STRIPE_TEST_KEY" ]; then
            echo "::notice::STRIPE_TEST_KEY is not set, so the Stripe contract test was skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install API dependencies
        if: steps.key.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
      - name: Run the Stripe contract test
        if: steps.key.outputs.present == 'true'
        env:
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
        run: node --test test/stripe-contract.test.js
