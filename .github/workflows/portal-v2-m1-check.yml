name: Portal V2 frontend checks
on:
  push:
    branches:
      - feature/portal-v2-m1-preview
      - feature/portal-v2-m2-api-integration
  pull_request:
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal-v2-m1-check.yml"
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate unit tests and static build
        run: npm run check
